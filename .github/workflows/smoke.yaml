name: smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-config:
    name: docker compose config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mainnet (.env.example)
        run: docker compose --env-file .env.example config --quiet
      - name: testnet (env/testnet.env)
        run: docker compose --env-file env/testnet.env config --quiet
      - name: regtest (env/regtest.env)
        run: docker compose --env-file env/regtest.env config --quiet

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck setup.sh and scripts/
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: setup.sh
          severity: warning

  rust:
    name: rpc-router build + test + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpc-router
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpc-router
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  regtest-boot:
    name: regtest stack boots + serves RPC through router
    runs-on: ubuntu-latest
    needs: [compose-config, rust]
    steps:
      - uses: actions/checkout@v4

      # rage-keygen ships in the upstream `age` package on Ubuntu.
      - name: install age (for setup.sh to generate Zallet identity)
        run: sudo apt-get update && sudo apt-get install -y age

      - name: setup.sh --network regtest
        run: ./setup.sh --network regtest

      - name: bring up regtest stack
        run: docker compose --env-file env/regtest.env up -d --wait
        env:
          # Make sure compose builds the local rpc-router image; the published
          # ghcr.io tag from main may not exist for forks running this in CI.
          DOCKER_DEFAULT_PLATFORM: linux/amd64

      - name: dump status after up
        if: always()
        run: |
          docker compose --env-file env/regtest.env ps
          docker compose --env-file env/regtest.env logs --tail=80

      - name: wait for router /health to return 200 (or fail loudly)
        run: |
          ROUTER_PORT=$(grep '^ZCASHNG_RPC_PORT=' env/regtest.env | cut -d= -f2)
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "http://127.0.0.1:${ROUTER_PORT}/health" || true)
            if [ "$code" = "200" ]; then
              echo "router /health 200:"
              cat /tmp/health.json
              echo
              exit 0
            fi
            echo "attempt $attempt: status=$code body=$(cat /tmp/health.json 2>/dev/null)"
            sleep 5
          done
          echo "router /health never returned 200" >&2
          exit 1

      - name: smoke a node-side RPC method through the router
        run: |
          ROUTER_PORT=$(grep '^ZCASHNG_RPC_PORT=' env/regtest.env | cut -d= -f2)
          resp=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"getblockchaininfo","params":[],"id":1}' \
            "http://127.0.0.1:${ROUTER_PORT}/")
          echo "$resp"
          # Assert the response carries a result (not just an error).
          echo "$resp" | jq -e '.result' >/dev/null

      - name: smoke a wallet-side RPC method through the router
        run: |
          ROUTER_PORT=$(grep '^ZCASHNG_RPC_PORT=' env/regtest.env | cut -d= -f2)
          # z_listaccounts is a Zallet method that works on a fresh wallet
          # (returns an empty list). Treat any non-error response as success.
          resp=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"z_listaccounts","params":[],"id":2}' \
            "http://127.0.0.1:${ROUTER_PORT}/")
          echo "$resp"
          # The response should NOT carry a JSON-RPC -32601 (method not found).
          echo "$resp" | jq -e '(.error | not) or (.error.code != -32601)' >/dev/null

      - name: tear down
        if: always()
        run: docker compose --env-file env/regtest.env down -v
