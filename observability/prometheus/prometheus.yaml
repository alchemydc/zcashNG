# Prometheus configuration for zcashNG.
#
# scrape_interval affects Grafana dashboard rate() queries: rate windows must
# be > 2x scrape_interval. With 15s scrape_interval, rate(...[1m]) is safe.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Zebra node metrics.
  - job_name: "zebra"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["zebra:9999"]
        labels:
          stack: "zcashng"

  # rpc-router liveness — no metrics exporter yet; we scrape /health and use
  # the `up` series + an alert rule (see rules/zebra_alerts.yml) to detect
  # outages. When the router gains metrics, point this at /metrics.
  - job_name: "rpc-router"
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: "/health"
    static_configs:
      - targets: ["rpc-router:8232"]
        labels:
          stack: "zcashng"
